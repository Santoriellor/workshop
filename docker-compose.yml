services:
  mysql:
    image: mysql:8.0
    restart: always
    secrets:
      - mysql_root_password
      - mysql_user
      - mysql_password
    env_file:
      - /srv/secrets/workshop/back.env
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: workshop_db
      MYSQL_USER_FILE: /run/secrets/mysql_user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
    volumes:
      - mysql_volume:/var/lib/mysql
      # :ro - the container has no reason to write to a seed script, and a
      # writable mount here means a compromised mysqld can alter what runs on
      # the next initialisation.
      - ./mysql/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - internal

  backend:
    build:
      context: .
      dockerfile: back/Dockerfile
    restart: always
    volumes:
      - static_volume:/backend/staticfiles
      - media_volume:/backend/media
    secrets:
      - django_secret_key
      - mysql_user
      - mysql_password
    env_file:
      - /srv/secrets/workshop/back.env
    environment:
      MYSQL_USER_FILE: /run/secrets/mysql_user
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_password
      IS_DOCKER: "True"
    depends_on:
      - mysql
    networks:
      - internal
      - proxy-network

    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. Containers attached to more than one
      # network leave the choice non-deterministic, and Traefik can pick the internal one.
      - "traefik.docker.network=proxy-network"

      # Backend is served at https://workshop.santoriello.ch/api
      - "traefik.http.routers.workshop-backend.rule=Host(`workshop.santoriello.ch`) && PathPrefix(`/api`)"
      - "traefik.http.routers.workshop-backend.entrypoints=websecure"
      - "traefik.http.routers.workshop-backend.tls.certresolver=le"

      # Django listens on port 8000
      - "traefik.http.services.workshop-backend.loadbalancer.server.port=8000"
      # security-headers and gzip-compress live in Traefik's file provider.
      - "traefik.http.routers.workshop-backend.middlewares=security-headers@file,gzip-compress@file"

  frontend:
    build:
      context: .
      dockerfile: front/Dockerfile
    restart: always
    volumes:
      - static_volume:/backend/staticfiles:ro
      - media_volume:/backend/media:ro
    env_file:
      - ./front/.env
    depends_on:
      - backend
    networks:
      - proxy-network

    labels:
      - "traefik.enable=true"
      # Pin the network Traefik routes over. Containers attached to more than one
      # network leave the choice non-deterministic, and Traefik can pick the internal one.
      - "traefik.docker.network=proxy-network"

      # Frontend exposed at https://workshop.santoriello.ch
      - "traefik.http.routers.workshop-frontend.rule=Host(`workshop.santoriello.ch`)"
      - "traefik.http.routers.workshop-frontend.entrypoints=websecure"
      - "traefik.http.routers.workshop-frontend.tls.certresolver=le"
      - "traefik.http.services.workshop-frontend.loadbalancer.server.port=80"
      - "traefik.http.routers.workshop-frontend.middlewares=security-headers@file,gzip-compress@file"

secrets:
  mysql_root_password:
    file: /srv/secrets/workshop/mysql_root_password.txt
  mysql_user:
    file: /srv/secrets/workshop/mysql_user.txt
  mysql_password:
    file: /srv/secrets/workshop/mysql_password.txt
  django_secret_key:
    file: /srv/secrets/workshop/django_secret_key.txt

volumes:
  mysql_volume:
  static_volume:
  media_volume:

networks:
  internal:
    internal: true
  proxy-network:
    external: true
