server {
  # 8080, not 80: nginx runs unprivileged and cannot bind below 1024.
  listen 8080;
  server_name localhost;

  # Serve React frontend
  root /usr/share/nginx/html;
  index index.html;

    # nginx.conf in frontend container
    location /media/ {
        alias /backend/media/;
        expires max;
        # /dev/stdout, not a file under /var/log/nginx: uid 101 cannot create
        # files there, and logs belong on stdout where `docker logs` sees them.
        access_log /dev/stdout;
    }

    location /static_django/ {
        alias /backend/staticfiles/;
        expires max;
        access_log /dev/stdout;
    }

  # React frontend (catch-all fallback)
  location / {
    try_files $uri /index.html;
  }
}
