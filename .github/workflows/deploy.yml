name: Deploy to VPS

on:
  push:
    branches: ["main"]    # or master

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          # CI-only throwaway values. Not secrets: this database exists for the
          # duration of one job and is reachable only from it.
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: workshop_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -pci-root-password --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install backend system dependencies
        run: |
          sudo apt-get update -qq
          # WeasyPrint/reportlab need these; mysqlclient needs the MariaDB dev
          # headers and pkg-config to compile.
          sudo apt-get install -y -qq \
            gcc pkg-config libmariadb-dev \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgdk-pixbuf-2.0-0 libglib2.0-0 libffi-dev libssl-dev

      - name: Install backend Python dependencies
        working-directory: back
        run: pip install -r requirements.txt

      - name: Lint and format-check the backend
        working-directory: .
        run: |
          pip install -r back/requirements-dev.txt
          ruff check back
          ruff format --check back

      - name: Run backend tests
        working-directory: back
        env:
          DJANGO_SETTINGS_MODULE: backend.settings
          DJANGO_SECRET_KEY: ci-only-key-not-used-in-production
          MYSQL_DATABASE: workshop_db
          MYSQL_USER: root
          MYSQL_PASSWORD: ci-root-password
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost
          STATIC_ROOT: ${{ runner.temp }}/staticfiles
          MEDIA_ROOT: ${{ runner.temp }}/media
        run: python -m pytest -q

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from front/.nvmrc rather than repeated here, so the
          # version has one home and CI cannot disagree with a local `nvm use`.
          node-version-file: 'front/.nvmrc'

      - name: Install frontend dependencies
        working-directory: front
        run: npm ci --legacy-peer-deps

      - name: Lint the frontend
        working-directory: front
        run: npx eslint . --max-warnings 0

      - name: Run frontend tests
        working-directory: front
        run: npx vitest run

  deploy:
    needs: test
    # Guard the branch here, not only in the workflow trigger. Step 4 below
    # temporarily adds this branch to `on:` so the test job can be exercised
    # before merging - without this condition, that would deploy a feature
    # branch to production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Copy project to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          # --delete makes the server mirror the repo. Without it a renamed or removed
          # file lingers forever: space-multi's deploy failed compiling a class and its
          # rename side by side. Excluded paths are NOT deleted unless --delete-excluded
          # is passed. Uploads, static files and the database are named Docker volumes,
          # and secrets come from /srv/secrets/workshop, so none of them live here.
          # nginx/media was excluded here until 2026-08-23. It was root-owned, dated
          # Dec 2025, and referenced by nothing in docker-compose.yml, which defines
          # only mysql, backend and frontend and mounts no host nginx dir -
          # nginx/frontend/nginx.conf reaches the image through the Dockerfile at
          # build time. rsync could not delete a root-owned path, so --delete failed
          # the whole transfer unless it was excluded. The estate retirement cycle
          # removed it from the server with root, so the exclusion is gone and that
          # path is mirrored like everything else.
          # Sockets are runtime artifacts and are never repo content.
          rsync -avz --delete \
            --exclude "*.sock" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "__pycache__" \
            ./ "$VPS_USER@$VPS_HOST:$VPS_DEPLOY_PATH/"

      - name: Build and restart services on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" "
            set -e
            cd '$VPS_DEPLOY_PATH'
            docker compose build --no-cache
            docker compose up -d
          "
